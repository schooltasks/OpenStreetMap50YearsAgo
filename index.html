<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Карта Будущего 2075</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* ============================================
           ГЛОБАЛЬНЫЕ СТИЛИ
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #050a15;
            color: #e0e8f0;
            height: 100vh;
            overflow: hidden;
        }

        /* ============================================
           ФОН С МЕРЦАЮЩИМИ ЗВЁЗДАМИ (РЕАЛИСТИЧНЫМИ)
           ============================================ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============================================
           КАРТА НА ВЕСЬ ЭКРАН
           ============================================ */
        .map-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }

        /* ============================================
           БОМБИЧЕСКИЙ МАРКЕР
           ============================================ */
        .click-marker {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ff0044, #ff5500);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 60px rgba(255, 0, 68, 0.9), 0 0 120px rgba(255, 0, 68, 0.4);
            animation: markerSuperPulse 1.2s ease-in-out infinite;
            pointer-events: none;
            position: relative;
        }
        .click-marker::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border-radius: 50%;
            border: 2px solid rgba(255, 0, 68, 0.3);
            animation: markerRing 1.2s ease-in-out infinite;
        }
        .click-marker::after {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;
            border-radius: 50%;
            border: 1px solid rgba(255, 0, 68, 0.15);
            animation: markerRing 1.2s ease-in-out infinite 0.4s;
        }
        @keyframes markerSuperPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; box-shadow: 0 0 80px rgba(255, 0, 68, 1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes markerRing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* ВСПЛЕСК ПРИ КЛИКЕ */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.8), transparent 70%);
            transform: scale(0);
            animation: rippleBoom 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes rippleBoom {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(20); opacity: 0; }
        }

        /* ============================================
           ПАНЕЛЬ — ПРОЗРАЧНАЯ, ЛЕВИТИРУЮЩАЯ
           ============================================ */
        .panel {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 420px;
            max-height: 92vh;
            background: rgba(10, 20, 40, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 204, 255, 0.2);
            border-radius: 24px;
            padding: 25px 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 204, 255, 0.05);
            animation: panelFloat 3s ease-in-out infinite;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .panel:hover {
            border-color: rgba(0, 204, 255, 0.5);
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.9), 0 0 60px rgba(0, 204, 255, 0.1);
            transform: translateY(-50%) scale(1.02);
        }
        
        @keyframes panelFloat {
            0%, 100% { transform: translateY(-50%) translateY(0px); }
            50% { transform: translateY(-50%) translateY(-8px); }
        }
        
        .panel::-webkit-scrollbar { width: 3px; }
        .panel::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00ccff, #ff00aa); border-radius: 10px; }

        /* ЗАГОЛОВОК С ОГНЁМ */
        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(0, 204, 255, 0.15);
            padding-bottom: 12px;
        }
        
        .panel-header .icon {
            font-size: 32px;
            animation: iconSpin 4s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.5));
        }
        @keyframes iconSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        .panel-header h1 {
            font-size: 22px;
            background: linear-gradient(90deg, #00ccff, #00ff88, #ff00aa, #00ccff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fireGradient 3s linear infinite;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 900;
        }
        @keyframes fireGradient {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }
        
        .panel .sub {
            font-size: 11px;
            color: #4a7a9a;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: subGlow 2s ease-in-out infinite;
        }
        @keyframes subGlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; text-shadow: 0 0 30px rgba(0, 204, 255, 0.3); }
        }

        /* ============================================
           ПОИСК — СВЕРХЪЕСТЕСТВЕННЫЙ
           ============================================ */
        .search-box {
            display: flex;
            gap: 10px;
            position: relative;
        }
        .search-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ccff, #ff00aa, #00ccff);
            background-size: 300% 300%;
            border-radius: 30px;
            z-index: -1;
            animation: searchGlow 3s ease-in-out infinite;
            filter: blur(8px);
            opacity: 0.5;
        }
        @keyframes searchGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .search-box input {
            flex: 1;
            padding: 14px 20px;
            background: rgba(5, 15, 30, 0.9);
            border: 1px solid rgba(42, 90, 122, 0.3);
            border-radius: 30px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
        }
        .search-box input:focus {
            border-color: #00ccff;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.15);
            transform: scale(1.05);
            background: rgba(5, 15, 30, 1);
        }
        .search-box input::placeholder {
            color: #4a6a8a;
            transition: 0.3s;
        }
        .search-box input:focus::placeholder {
            opacity: 0.2;
            transform: translateX(20px);
        }
        
        .search-box button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #00aaee, #ff00aa);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .search-box button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: 0.8s;
        }
        .search-box button:hover::before {
            transform: rotate(45deg) translateX(100%);
        }
        .search-box button:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 10px 50px rgba(0, 170, 238, 0.5);
        }
        .search-box button:active {
            transform: scale(0.9);
        }

        /* ============================================
           ПРИМЕРЫ ГОРОДОВ — ПАРЯТ
           ============================================ */
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .examples span {
            background: rgba(10, 26, 42, 0.6);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: #6a9ac0;
            border: 1px solid rgba(26, 58, 85, 0.3);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }
        .examples span:hover {
            background: rgba(26, 58, 90, 0.9);
            color: white;
            border-color: #00ccff;
            transform: translateY(-4px) scale(1.1);
            box-shadow: 0 8px 30px rgba(0, 200, 255, 0.3);
        }
        .examples span:active {
            transform: scale(0.8);
        }

        /* ============================================
           РЕЗУЛЬТАТ — ВЗРЫВНОЙ
           ============================================ */
        #resultBlock {
            background: rgba(0, 15, 30, 0.5);
            border: 1px solid rgba(26, 74, 106, 0.2);
            border-radius: 16px;
            padding: 20px;
            flex: 1;
            display: none;
            flex-direction: column;
            min-height: 260px;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }
        #resultBlock::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: conic-gradient(from 0deg, transparent, rgba(0, 204, 255, 0.03), transparent, rgba(255, 0, 170, 0.03), transparent);
            animation: rotateBg 30s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateBg {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        #resultBlock.visible {
            display: flex;
            animation: resultSuperBoom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes resultSuperBoom {
            0% { opacity: 0; transform: scale(0.5) rotate(-10deg) translateY(60px); }
            50% { transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg) translateY(0); }
        }

        #cityName {
            font-size: 28px;
            font-weight: 900;
            color: #88ddff;
            text-shadow: 0 0 50px rgba(0, 200, 255, 0.3);
            animation: nameSuperGlow 2s ease-in-out infinite;
            line-height: 1.2;
            position: relative;
            z-index: 1;
        }
        @keyframes nameSuperGlow {
            0%, 100% { text-shadow: 0 0 30px rgba(0, 200, 255, 0.2); }
            50% { text-shadow: 0 0 60px rgba(0, 200, 255, 0.5), 0 0 120px rgba(0, 200, 255, 0.2); }
        }
        
        #cityCoords {
            font-size: 12px;
            color: #4a7a9a;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        /* ============================================
           СТАТИСТИКА — МЕГА-КАРТОЧКИ
           ============================================ */
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 6px 0;
            position: relative;
            z-index: 1;
        }
        
        .stat-card {
            background: rgba(5, 15, 30, 0.5);
            padding: 10px 12px;
            border-radius: 12px;
            border-left: 3px solid #00ccff;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 204, 255, 0.05), transparent);
            opacity: 0;
            transition: 0.5s;
        }
        .stat-card:hover::after {
            opacity: 1;
        }
        .stat-card:nth-child(1) { animation: cardSuperBoom 0.6s ease backwards 0.05s; }
        .stat-card:nth-child(2) { animation: cardSuperBoom 0.6s ease backwards 0.15s; }
        .stat-card:nth-child(3) { animation: cardSuperBoom 0.6s ease backwards 0.25s; }
        .stat-card:nth-child(4) { animation: cardSuperBoom 0.6s ease backwards 0.35s; }
        
        @keyframes cardSuperBoom {
            from { opacity: 0; transform: translateX(-60px) rotate(-5deg) scale(0.5); }
            to { opacity: 1; transform: translateX(0) rotate(0deg) scale(1); }
        }
        
        .stat-card:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 40px rgba(0, 200, 255, 0.15);
            border-left-color: #ff00aa;
        }
        
        .stat-card .label {
            font-size: 10px;
            color: #5a7a9a;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .stat-card .value {
            font-size: 18px;
            font-weight: 900;
            margin-top: 3px;
            transition: all 0.5s ease;
        }
        
        .value.danger {
            color: #ff4455;
            animation: dangerSuperPulse 1s ease-in-out infinite;
        }
        .value.warning {
            color: #ffaa33;
            animation: warningSuperPulse 1.5s ease-in-out infinite;
        }
        .value.good {
            color: #44dd88;
        }
        
        @keyframes dangerSuperPulse {
            0%, 100% { opacity: 1; transform: scale(1); text-shadow: 0 0 20px rgba(255, 68, 85, 0.3); }
            50% { opacity: 0.5; transform: scale(1.15); text-shadow: 0 0 60px rgba(255, 68, 85, 0.6); }
        }
        @keyframes warningSuperPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); text-shadow: 0 0 40px rgba(255, 170, 51, 0.4); }
        }

        /* ============================================
           БЕЙДЖ — ЭПИЧНЫЙ
           ============================================ */
        .badge-status {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 12px;
            text-align: center;
            margin: 4px 0;
            transition: all 0.5s ease;
            position: relative;
            z-index: 1;
            animation: badgeSuperBoom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        @keyframes badgeSuperBoom {
            from { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        
        .badge-danger {
            background: rgba(68, 17, 34, 0.8);
            color: #ff4455;
            border: 1px solid #ff4455;
            box-shadow: 0 0 50px rgba(255, 68, 85, 0.3);
            animation: badgeDangerSuper 1.5s ease-in-out infinite;
        }
        @keyframes badgeDangerSuper {
            0%, 100% { box-shadow: 0 0 50px rgba(255, 68, 85, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 100px rgba(255, 68, 85, 0.6); transform: scale(1.05); }
        }
        
        .badge-warning {
            background: rgba(51, 34, 0, 0.8);
            color: #ffaa33;
            border: 1px solid #ffaa33;
            box-shadow: 0 0 50px rgba(255, 170, 51, 0.3);
            animation: badgeWarningSuper 2s ease-in-out infinite;
        }
        @keyframes badgeWarningSuper {
            0%, 100% { box-shadow: 0 0 50px rgba(255, 170, 51, 0.3); }
            50% { box-shadow: 0 0 100px rgba(255, 170, 51, 0.6); }
        }
        
        .badge-good {
            background: rgba(0, 51, 34, 0.8);
            color: #44dd88;
            border: 1px solid #44dd88;
            box-shadow: 0 0 50px rgba(68, 221, 136, 0.3);
        }

        /* ============================================
           ОПИСАНИЕ
           ============================================ */
        #descriptionText {
            background: rgba(0, 10, 20, 0.5);
            padding: 14px 16px;
            border-radius: 12px;
            margin: 8px 0;
            font-size: 13px;
            line-height: 1.7;
            border: 1px solid rgba(26, 58, 85, 0.2);
            color: #a0b8d0;
            flex: 1;
            overflow-y: auto;
            position: relative;
            z-index: 1;
            transition: all 0.5s ease;
        }
        #descriptionText:hover {
            border-color: rgba(0, 204, 255, 0.3);
        }
        
        #descriptionText::-webkit-scrollbar { width: 3px; }
        #descriptionText::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00ccff, #ff00aa); border-radius: 10px; }

        /* ============================================
           ФУТЕР
           ============================================ */
        .stats-footer {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #335577;
            margin-top: 4px;
            border-top: 1px solid rgba(26, 58, 85, 0.15);
            padding-top: 8px;
            position: relative;
            z-index: 1;
        }
        #clickCounter {
            color: #00ccff;
            font-weight: bold;
        }

        /* ============================================
           АДАПТИВ
           ============================================ */
        @media (max-width: 900px) {
            .panel {
                right: 10px;
                width: 340px;
                padding: 18px 16px;
            }
            #cityName { font-size: 22px; }
            .stat-card .value { font-size: 16px; }
        }
        
        @media (max-width: 600px) {
            .panel {
                right: 5px;
                bottom: 5px;
                top: auto;
                transform: none;
                width: calc(100% - 10px);
                max-height: 55vh;
                border-radius: 16px;
                animation: none;
            }
            .panel:hover {
                transform: scale(1.02);
            }
            @keyframes panelFloat {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-5px); }
            }
            .panel:hover {
                transform: scale(1.02);
            }
            .search-box {
                flex-direction: column;
            }
            .search-box button {
                padding: 12px;
            }
            .grid-2col {
                grid-template-columns: 1fr 1fr;
                gap: 5px;
            }
            .stat-card {
                padding: 8px 10px;
            }
            .stat-card .value {
                font-size: 14px;
            }
            .examples span {
                font-size: 10px;
                padding: 3px 10px;
            }
            #cityName {
                font-size: 20px;
            }
            .panel-header h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<!-- ===== ЧАСТИЦЫ (ЗВЁЗДЫ) ===== -->
<canvas id="particles-canvas"></canvas>

<!-- ===== КАРТА (ВЕСЬ ЭКРАН) ===== -->
<div class="map-wrapper" id="mapWrapper">
    <div id="map"></div>
</div>

<!-- ===== ПАНЕЛЬ (ПАРИТ НАД КАРТОЙ) ===== -->
<div class="panel">
    <div class="panel-header">
        <span class="icon">⚡</span>
        <h1>Прогноз 2075</h1>
    </div>
    <div class="sub">🔮 КЛИМАТИЧЕСКАЯ МОДЕЛЬ</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Введите город, место...">
        <button id="searchBtn">🚀 НАЙТИ</button>
    </div>

    <div class="examples">
        <span data-place="Москва">Москва</span>
        <span data-place="Санкт-Петербург">СПб</span>
        <span data-place="Нью-Йорк">Нью-Йорк</span>
        <span data-place="Лондон">Лондон</span>
        <span data-place="Токио">Токио</span>
        <span data-place="Сидней">Сидней</span>
        <span data-place="Каир">Каир</span>
        <span data-place="Париж">Париж</span>
        <span data-place="Пекин">Пекин</span>
        <span data-place="Рио">Рио</span>
    </div>

    <div id="resultBlock">
        <div id="cityName">—</div>
        <div id="cityCoords">📍 Координаты: —</div>
        
        <div class="grid-2col">
            <div class="stat-card">
                <div class="label">🌡️ Температура</div>
                <div class="value" id="tempValue">—</div>
            </div>
            <div class="stat-card">
                <div class="label">🌊 Уровень воды</div>
                <div class="value" id="waterValue">—</div>
            </div>
            <div class="stat-card">
                <div class="label">🌪️ Экстремальные явления</div>
                <div class="value" id="extremeValue" style="font-size:13px;">—</div>
            </div>
            <div class="stat-card">
                <div class="label">🏙️ Пригодность</div>
                <div class="value" id="habitableValue">—</div>
            </div>
        </div>

        <div id="statusBadge" class="badge-status">⚠️ ОЦЕНКА РИСКА</div>
        <div id="descriptionText">Кликни на карту или найди место через поиск...</div>
        
        <div class="stats-footer">
            <span id="clickCounter">👆 Кликов: 0</span>
            <span>🌍 OpenStreetMap</span>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // ============================================
    // 0. ЧАСТИЦЫ (ЗВЁЗДЫ) НА CANVAS
    // ============================================
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speed = 0.02 + Math.random() * 0.03;
            this.opacity = Math.random() * 0.8 + 0.2;
            this.twinkleSpeed = 0.02 + Math.random() * 0.03;
        }
        update() {
            this.opacity += Math.sin(Date.now() * this.twinkleSpeed) * 0.01;
            this.opacity = Math.max(0.1, Math.min(1, this.opacity));
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.fill();
            
            // Свечение
            if (this.size > 1.5) {
                ctx.shadowColor = 'rgba(150, 200, 255, 0.3)';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
    }
    
    for (let i = 0; i < 200; i++) {
        stars.push(new Star());
    }
    
    function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => {
            star.update();
            star.draw();
        });
        requestAnimationFrame(animateStars);
    }
    animateStars();

    // ============================================
    // 1. КАРТА (ВЕСЬ ЭКРАН)
    // ============================================
    const map = L.map('map', {
        center: [55.7558, 37.6173],
        zoom: 5,
        zoomControl: true,
        fadeAnimation: true,
        zoomAnimation: true,
        markerZoomAnimation: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        subdomains: 'abc',
        maxZoom: 19
    }).addTo(map);

    let currentMarker = null;
    let clickCount = 0;

    // ============================================
    // 2. БАЗА ЗНАНИЙ
    // ============================================
    const cityKnowledge = {
        'москва': {

            waterRise: 0.3,
            extreme: '🌧️ Увеличение осадков',
            habitable: 'Благоприятно',
            description: 'Москва станет теплее: зимы мягче, снега меньше. Увеличатся дожди, но серьёзных угроз нет.'

            tempRise: 3.5,
            waterRise: 0.8,
            extreme: '🌊 Защита от наводнений',

            description: 'Петербургу требуется защита от Невы. Уровень воды поднимется, нужны новые дамбы.'

            waterRise: 2.0,

        },
        'лондон': {
            tempRise: 3.8,
            waterRise: 0.9,
            extreme: '🌧️ Ливни',
            habitable: 'Умеренно',
            description: 'Лондон станет влажнее. Уровень Темзы поднимется, восточные районы в зоне риска.'
        },
        'токио': {
            tempRise: 4.2,
            waterRise: 1.2,
            extreme: '🌀 Тайфуны',
            habitable: 'Сложно',
            description: 'Токио под угрозой супертайфунов. Город переносит инфраструктуру на возвышенности.'
        },
        'сидней': {
            tempRise: 3.5,
            waterRise: 0.7,

            habitable: 'Умеренно',
            description: 'Сидней станет жарче и суше. Пожары вокруг города — ежегодная угроза.'
        },
        'каир': {
            tempRise: 5.5,
            waterRise: 0.2,
            extreme: '☀️ Экстремальная жара',
            habitable: 'Критично',
            description: 'Каир столкнётся с невыносимой жарой: летом до +50°C. Нил мелеет, возможна массовая миграция.'

        'париж': {
            tempRise: 3.6,

            habitable: 'Благоприятно',
            description: 'Париж станет теплее. Ливни учащаются, но серьёзных угроз нет.'
        },
        'пекин': {
            tempRise: 4.0,
            waterRise: 0.3,
            extreme: '🌪️ Пыльные бури',
            habitable: 'Сложно',
            description: 'Пекин сталкивается с пыльными бурями и жарой. Требуется модернизация водоснабжения.'
        },
        'рио-де-жанейро': {
            tempRise: 4.8,
            waterRise: 1.5,
            extreme: '🌀 Штормы и оползни',
            habitable: 'Сложно',
            description: 'Рио под угрозой штормов. Оползни в бедных кварталах становятся опаснее.'
        },
        'берлин': {
            tempRise: 3.4,
            waterRise: 0.3,
            extreme: '🌤️ Умеренные изменения',
            habitable: 'Благоприятно',
            description: 'Берлин станет теплее. Изменения умеренны, город адаптируется без серьёзных проблем.'
        }
    };

    // ============================================
    // 3. ПРОГНОЗ
    // ============================================
    function getClimateForecast(lat, lon, placeName) {
        const lowerName = placeName ? placeName.toLowerCase() : '';
        
        for (const [key, data] of Object.entries(cityKnowledge)) {
            if (lowerName.includes(key)) {
                return { ...data };
            }
        }

        const absLat = Math.abs(lat);
        const isCoastal = Math.abs(lon) > 30 && Math.abs(lon) < 150;
        const isTropical = absLat < 23.5;
        const isPolar = absLat > 66.5;
        const isDesert = absLat > 20 && absLat < 40 && !isCoastal;

        let tempRise = 2.8;
        if (isTropical) tempRise = 4.5;
        else if (isPolar) tempRise = 4.2;
        else if (isDesert) tempRise = 5.0;
        else if (absLat > 40 && absLat < 60 && !isCoastal) tempRise = 3.2;
        tempRise = Math.round((tempRise + (Math.random() - 0.5) * 0.4) * 10) / 10;

        let waterRise = 0.2;
        if (isCoastal && absLat < 40) waterRise = 1.8;
        else if (isCoastal && absLat < 60) waterRise = 1.0;
        waterRise = Math.round((waterRise + (Math.random() - 0.5) * 0.3) * 10) / 10;

        let extreme = '🌤️ Умеренные изменения';
        let description = '';
        
        if (isPolar) {
            extreme = '❄️ Таяние вечной мерзлоты';
            description = 'Арктика нагревается быстрее всего. Таяние льдов изменит экосистемы.';
        }
        else if (isTropical && isCoastal) {
            extreme = '🌀 Ураганы и штормы';
            description = 'Тропические регионы столкнутся с усилением ураганов.';
        }
        else if (isTropical && !isCoastal) {
            extreme = '🔥 Аномальная жара';
            description = 'В тропиках станет ещё жарче. Учащаются засухи.';
        }
        else if (isDesert) {
            extreme = '☀️ Экстремальная жара';
            description = 'Пустыни расширяются. Температура достигает +50°C.';
        }
        else if (absLat > 40 && absLat < 60 && isCoastal) {
            extreme = '🌊 Повышение уровня моря';
            description = 'Прибрежные зоны сталкиваются с подъёмом воды.';
        }
        else if (absLat > 40 && absLat < 60 && !isCoastal) {
            extreme = '🌧️ Изменение осадков';
            description = 'Континентальные регионы становятся влажнее.';
        }
        else {
            extreme = '🌤️ Умеренные изменения';
            description = 'Изменения климата будут заметны, но без катастроф.';
        }

        let habitable = 'Благоприятно';
        let riskNote = '';
        
        if (tempRise > 5.5 || waterRise > 2.2) {
            habitable = 'Критично';
            riskNote = 'Условия становятся опасными. ';
        } else if (tempRise > 4.2 || waterRise > 1.5) {
            habitable = 'Сложно';
            riskNote = 'Потребуется адаптация. ';
        } else {
            habitable = 'Благоприятно';
            riskNote = 'Изменения умеренны. ';
        }

        let fullDescription = riskNote;
        fullDescription += `Температура вырастет на ${tempRise}°C. `;
        fullDescription += `Уровень воды изменится на ${waterRise} м. `;
        fullDescription += description;

        return { tempRise, waterRise, extreme, habitable, description: fullDescription };
    }

    // ============================================
    // 4. ПОКАЗ РЕЗУЛЬТАТА
    // ============================================
    function showResult(placeName, lat, lon) {
        const data = getClimateForecast(lat, lon, placeName);
        clickCount++;
        document.getElementById('clickCounter').textContent = `👆 Кликов: ${clickCount}`;

        const resultBlock = document.getElementById('resultBlock');
        resultBlock.classList.remove('visible');

        setTimeout(() => {
            document.getElementById('cityName').textContent = placeName || 'Неизвестное место';
            document.getElementById('cityCoords').textContent = `📍 ${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;
            
            const tempEl = document.getElementById('tempValue');
            tempEl.textContent = `+${data.tempRise}°C`;
            tempEl.className = 'value ' + (data.tempRise > 5.0 ? 'danger' : data.tempRise > 3.8 ? 'warning' : 'good');
            
            const waterEl = document.getElementById('waterValue');
            waterEl.textContent = `${data.waterRise} м`;
            waterEl.className = 'value ' + (data.waterRise > 1.8 ? 'danger' : data.waterRise > 1.0 ? 'warning' : 'good');
            
            document.getElementById('extremeValue').textContent = data.extreme;
            
            const habEl = document.getElementById('habitableValue');
            habEl.textContent = data.habitable;
            habEl.className = 'value ' + (data.habitable === 'Критично' ? 'danger' : data.habitable === 'Сложно' ? 'warning' : 'good');
            
            const badge = document.getElementById('statusBadge');
            if (data.habitable === 'Критично') {
                badge.className = 'badge-status badge-danger';
                badge.textContent = '🚨 ВЫСОКИЙ РИСК';
            } else if (data.habitable === 'Сложно') {
                badge.className = 'badge-status badge-warning';
                badge.textContent = '⚠️ ТРЕБУЕТСЯ АДАПТАЦИЯ';
            } else {
                badge.className = 'badge-status badge-good';
                badge.textContent = '✅ ОТНОСИТЕЛЬНАЯ БЕЗОПАСНОСТЬ';
            }
            
            document.getElementById('descriptionText').textContent = data.description;
            resultBlock.classList.add('visible');
        }, 200);
    }

    // ============================================
    // 5. МАРКЕР
    // ============================================
    function addMarker(lat, lon, label) {
        if (currentMarker) {
            map.removeLayer(currentMarker);
        }

        const icon = L.divIcon({
            className: 'click-marker',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        currentMarker = L.marker([lat, lon], { icon: icon }).addTo(map);
        map.setView([lat, lon], Math.max(8, map.getZoom()), {
            animate: true,
            duration: 1.5
        });
        
        showResult(label || `${lat.toFixed(2)}, ${lon.toFixed(2)}`, lat, lon);
    }

    // ============================================
    // 6. ВСПЛЕСК
    // ============================================
    function createRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = (x - 30) + 'px';
        ripple.style.top = (y - 30) + 'px';
        ripple.style.width = '60px';
        ripple.style.height = '60px';
        document.getElementById('mapWrapper').appendChild(ripple);
        setTimeout(() => ripple.remove(), 1500);
    }

    // ============================================
    // 7. КЛИК ПО КАРТЕ
    // ============================================
    map.on('click', function(e) {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;
        
        const container = document.getElementById('mapWrapper');
        const rect = container.getBoundingClientRect();
        const x = e.originalEvent.clientX - rect.left;
        const y = e.originalEvent.clientY - rect.top;
        createRipple(x, y);
        
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=ru`)
            .then(res => res.json())
            .then(data => {
                let placeName = 'Неизвестное место';
                if (data.display_name) {
                    const parts = data.display_name.split(',');
                    placeName = parts.slice(0, 2).join(',').trim();
                }
                addMarker(lat, lon, placeName);
            })
            .catch(() => {
                addMarker(lat, lon, `${lat.toFixed(2)}, ${lon.toFixed(2)}`);
            });
    });

    // ============================================
    // 8. ПОИСК
    // ============================================
    document.getElementById('searchBtn').addEventListener('click', function() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        document.getElementById('resultBlock').classList.remove('visible');
        document.getElementById('cityName').textContent = '⏳ ПОИСК...';
        document.getElementById('cityName').style.color = '#6a8aaa';

        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&accept-language=ru`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('cityName').style.color = '#88ddff';
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    const name = data[0].display_name.split(',')[0];
                    addMarker(lat, lon, name);
                } else {
                    alert('❌ Место не найдено.');
                    document.getElementById('cityName').textContent = '—';
                }
            })
            .catch(() => {
                alert('⚠️ Ошибка поиска. Проверьте интернет.');
                document.getElementById('cityName').textContent = '—';
                document.getElementById('cityName').style.color = '#88ddff';
            });
    });

    // ============================================
    // 9. ПРИМЕРЫ
    // ============================================
    document.querySelectorAll('.examples span').forEach(el => {
        el.addEventListener('click', function() {
            const place = this.dataset.place;
            document.getElementById('searchInput').value = place;
            document.getElementById('searchBtn').click();
            
            this.style.transform = 'scale(0.7)';
            setTimeout(() => {
                this.style.transform = '';
            }, 300);
        });
    });

    // ============================================
    // 10. ENTER
    // ============================================
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });

    // ============================================
    // 11. СТАРТ
    // ============================================
    console.log('🌍 Карта Будущего 2075 загружена!');
    console.log('🔥 МЕГА-БОМБИЧЕСКАЯ ВЕРСИЯ 2.0!');
    console.log('✅ Карта на весь экран, панель парит!');
</script>
